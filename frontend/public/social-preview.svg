    @font-face { font-family: Geist; src: url('fonts/geist-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
    .display { font-family: Outfit, sans-serif; fill: #202c23; font-weight: 500; }
    .body { font-family: Geist, sans-serif; fill: #5d6a58; }
