# Netlify auto-deploy: connect the GitHub repo and Netlify builds on every push to main.
# The app uses relative asset paths, so it serves from a site root unchanged.
[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The workspace is client-side only. Unknown paths get the project's own 404 page.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
