name: Deploy Welina Analytics to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Keep production deployments in order; only superseded PR checks are canceled.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  # A stalled browser download used to sit on the socket until the job timeout killed the
  # whole deployment. Bounding each connection lets the retry loop start a fresh attempt.
  PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '60000'

jobs:
  # Fast, deterministic checks plus the Pages bundle. This job no longer waits on a browser
  # download, so a slow CDN or runner can never cost us the production deployment again.
  build:
    name: Build site and run fast checks
    # Pinned instead of ubuntu-latest: the label is mid-migration to Ubuntu 26 and a mixed
    # image pool makes the browser dependency install unpredictable.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate shared clinical fixture and demo analytics
        working-directory: frontend
        run: npm test

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      # Renders every analytics section on the server so prop and helper mistakes that a
      # bundle cannot catch fail the build instead of the browser.
      - name: Render analytics sections headlessly
        working-directory: frontend
        run: npm run smoke

      - name: Build frontend application
        working-directory: frontend
        run: npm run build

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build API with embedded clinical fixture
        run: dotnet build backend/Welina.Analytics.sln --configuration Release

      # PRs and manual runs on development branches validate without publishing.
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  # The browser suite is the long pole (~8 minutes serially). It runs as two independent
  # shards in parallel, so one slow machine costs four minutes instead of the whole budget.
  browser:
    name: UX regression · shard ${{ matrix.shard }}/2
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend application
        working-directory: frontend
        run: npm run build

      - name: Restore cached Chromium build
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      # Headless shell is all these tests use, so only that download is needed. Each
      # attempt is time-boxed and retried: a transient CDN reset is not a deployment failure.
      - name: Install Chromium for UX regression checks
        working-directory: frontend
        timeout-minutes: 8
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx playwright install --with-deps --only-shell --no-progress chromium; then
              exit 0
            fi
            echo "::warning::Playwright browser install failed (attempt ${attempt}/3); retrying."
            sleep 15
          done
          echo "::error::Could not install Chromium after three attempts."
          exit 1

      - name: Verify accessible desktop and mobile flows under the Pages path
        working-directory: frontend
        run: npx playwright test --shard=${{ matrix.shard }}/2

      - name: Preserve failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-diagnostics-${{ matrix.shard }}
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build, browser]
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
